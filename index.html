<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PELLET ROULETTE</title><style>html,body{margin:0;overflow:hidden;background:#0d1723;color:white;font-family:system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#title{position:absolute;top:20px;left:22px;font-weight:900;letter-spacing:3px}#stats{position:absolute;right:20px;top:20px;text-align:right;font:14px monospace}#ammo{position:absolute;right:20px;bottom:20px;font:bold 34px monospace}#status{position:absolute;left:20px;bottom:20px;font:12px monospace;color:#ffc578}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:26px monospace}#overlay{position:fixed;inset:0;background:#07101de9;display:grid;place-items:center;text-align:center}button{background:#ffc578;border:0;border-radius:6px;padding:13px 28px;font-weight:bold;cursor:pointer}p{line-height:1.9;color:#b9c9d8}#hit{position:absolute;top:45%;left:50%;color:#ffc578;opacity:0}</style></head><body><div id="hud"><div id="title">PELLET <span style="color:#ffc578">ROULETTE</span><div style="font:10px monospace;color:#b9c9d8">PHASE 1 · FPS TEST ARENA</div></div><div id="stats"></div><div id="cross">+</div><div id="hit">✕ HIT</div><div id="status">READY</div><div id="ammo">06 / 30</div></div><div id="overlay"><div><h1>PELLET ROULETTE</h1><p>WASD 移动 · 鼠标瞄准 · 左键射击<br>Space 跳跃 · Shift 冲刺 · 双击 Shift 战术冲刺<br>R 逐发换弹 · P 重置位置 · Esc 暂停</p><button id="start">进入训练场</button><p style="font-size:12px">推荐桌面 Chrome / Edge，需联网加载 Three.js</p></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=s=>document.querySelector(s),scene=new T.Scene();scene.background=new T.Color(0x142638);scene.fog=new T.Fog(0x142638,35,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);const cam=new T.PerspectiveCamera(85,innerWidth/innerHeight,.05,120);cam.rotation.order='YXZ';scene.add(new T.HemisphereLight(0xb3d8ff,0x344353,2.5));const light=new T.DirectionalLight(0xffe0af,2);light.position.set(-10,20,10);scene.add(light);const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.7});function box(w,h,d,x,y,z,m,p=scene){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o}box(88,1,88,0,-.5,0,mat(0x293b49));const grid=new T.GridHelper(88,22,0x59788a,0x3b5364);grid.position.y=.015;scene.add(grid);const wall=mat(0x344b5e),metal=mat(0x637b8c),gold=mat(0xe8b56f);for(const s of [-1,1]){box(88,8,1,0,4,44*s,wall);box(1,8,88,44*s,4,0,wall)}const obs=[];for(const [x,z,w,d,h] of [[-12,-10,4,4,3],[12,-10,4,4,3],[-13,12,5,3,3],[13,12,5,3,3],[-22,0,3,7,4],[22,0,3,7,4]]){box(w,h,d,x,h/2,z,metal);box(w+.1,.12,d+.1,x,h,z,gold);obs.push({x,z,w,d,h})}const targets=[];for(let i=0;i<7;i++){const x=(i-3)*6.5,z=-27+(i%2)*5,g=new T.Group();g.position.set(x,0,z);box(1.1,1.6,.65,0,1.4,0,mat(0xd46c5b),g);const head=new T.Mesh(new T.SphereGeometry(.34,12,10),mat(0xe6b78d));head.position.y=2.5;g.add(head);box(.9,.25,.9,0,.22,0,metal,g);g.userData={x,hp:120,respawn:0,moving:i%3===0};g.traverse(o=>{if(o.isMesh)o.userData.target=g});scene.add(g);targets.push(g)}const gun=new T.Group();cam.add(gun);scene.add(cam);box(.2,.19,.95,0,0,-.35,metal,gun);box(.13,.13,.75,0,.05,-.85,mat(0xadb8c2),gun);box(.24,.2,.5,0,-.12,-.05,mat(0x73533e),gun);box(.12,.3,.18,0,-.25,.15,mat(0x73533e),gun);const muzzle=new T.PointLight(0xffb65e,0,7);muzzle.position.set(0,.04,-1.25);gun.add(muzzle);let pos=new T.Vector3(0,1.7,23),vel=new T.Vector3(),vy=0,grounded=true,yaw=0,pitch=0,active=false,ammo=6,reserve=30,reloading=false,reloadAt=0,nextShot=0,lastShift=-5,tactical=false,shift=false,stamina=1,kick=0,flash=0,hitTime=0;const keys=new Set(),ray=new T.Raycaster(),traces=[];function reset(){pos.set(0,1.7,23);vel.set(0,0,0);vy=0;grounded=true}function reload(now){if(!reloading&&ammo<6&&reserve>0){reloading=true;reloadAt=now+.42}}function shoot(now){if(now<nextShot)return;if(!ammo){reload(now);return}if(tactical){tactical=false;nextShot=now+.15;return}reloading=false;ammo--;nextShot=now+.65;kick=.15;flash=.065;muzzle.intensity=30;const origin=cam.getWorldPosition(new T.Vector3()),forward=cam.getWorldDirection(new T.Vector3()),right=new T.Vector3(1,0,0).applyQuaternion(cam.quaternion),up=new T.Vector3(0,1,0).applyQuaternion(cam.quaternion);const meshes=[];targets.filter(t=>t.visible).forEach(t=>t.traverse(o=>{if(o.isMesh)meshes.push(o)}));let hits=0;for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*.07,dir=forward.clone().addScaledVector(right,Math.cos(a)*r).addScaledVector(up,Math.sin(a)*r).normalize();ray.set(origin,dir);ray.far=60;const first=ray.intersectObjects(meshes,false)[0];let dist=38;if(first){dist=first.distance;const target=first.object.userData.target;if(target){target.userData.hp-=8;hits++;if(target.userData.hp<=0){target.visible=false;target.userData.respawn=now+2.2}}}const geo=new T.BufferGeometry().setFromPoints([origin.clone().addScaledVector(dir,.5),origin.clone().addScaledVector(dir,dist)]),line=new T.Line(geo,new T.LineBasicMaterial({color:0xffd29a,transparent:true,opacity:.65}));scene.add(line);traces.push({line,life:.09})}if(hits)hitTime=.16}document.addEventListener('keydown',e=>{if(!active)return;if(['Space','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys.add(e.code);if(e.code==='Space'&&grounded){vy=7;grounded=false}if(e.code==='KeyR')reload(performance.now()/1000);if(e.code==='KeyP')reset();if(e.code.startsWith('Shift')){const n=performance.now()/1000;if(n-lastShift<.3&&stamina>.1)tactical=true;lastShift=n;shift=true}});document.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code.startsWith('Shift')){shift=false;tactical=false}});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.002;pitch=T.MathUtils.clamp(pitch-e.movementY*.002,-1.46,1.46)});renderer.domElement.addEventListener('mousedown',e=>{if(!active)return;if(document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock();return}if(e.button===0)shoot(performance.now()/1000)});$('#start').onclick=()=>{active=true;$('#overlay').style.display='none';renderer.domElement.requestPointerLock()};document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==renderer.domElement){active=false;keys.clear();shift=false;tactical=false;$('#overlay').style.display='grid';$('#start').textContent='继续测试'}});window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});renderer.setSize(innerWidth,innerHeight);let last=performance.now()/1000;function tick(){requestAnimationFrame(tick);const now=performance.now()/1000,dt=Math.min(.035,now-last);last=now;if(active){const f=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),wish=new T.Vector3();if(keys.has('KeyW'))wish.add(f);if(keys.has('KeyS'))wish.sub(f);if(keys.has('KeyD'))wish.add(r);if(keys.has('KeyA'))wish.sub(r);const moving=wish.lengthSq()>0;if(moving)wish.normalize();if(tactical){stamina-=dt/3;if(stamina<=0){stamina=0;tactical=false}}else stamina=Math.min(1,stamina+dt/4);const speed=tactical?17:shift?12:8;if(grounded){if(!moving)vel.multiplyScalar(Math.max(0,1-9*dt));else{const along=vel.dot(wish);vel.addScaledVector(wish,Math.min(Math.max(0,speed-along),65*dt));const side=vel.clone().addScaledVector(wish,-vel.dot(wish));vel.addScaledVector(side,-Math.min(1,dt*6))}}else if(moving){const along=vel.dot(wish);vel.addScaledVector(wish,Math.min(Math.max(0,12-along),240*dt))}if(vel.length()>24)vel.setLength(24);if(!grounded)vy-=22*dt;pos.addScaledVector(vel,dt);pos.y+=vy*dt;pos.x=T.MathUtils.clamp(pos.x,-43,43);pos.z=T.MathUtils.clamp(pos.z,-43,43);for(const o of obs){if(pos.y-1.7>=o.h)continue;const dx=pos.x-o.x,dz=pos.z-o.z,px=o.w/2+.45-Math.abs(dx),pz=o.d/2+.45-Math.abs(dz);if(px>0&&pz>0){if(px<pz){pos.x+=Math.sign(dx||1)*px;vel.x=0}else{pos.z+=Math.sign(dz||1)*pz;vel.z=0}}}if(pos.y<=1.7){pos.y=1.7;vy=0;grounded=true}else grounded=false;if(reloading&&now>=reloadAt){ammo++;reserve--;reloadAt=now+.42;if(ammo===6||reserve===0)reloading=false}kick=T.MathUtils.damp(kick,0,12,dt);cam.position.copy(pos);cam.rotation.set(pitch-kick*.35,yaw,0);cam.fov=T.MathUtils.damp(cam.fov,tactical?96:shift?91:85,8,dt);cam.updateProjectionMatrix();gun.position.set(.45,-.37-(reloading?.12:0),-.7+kick*.6);gun.rotation.set(-kick,0,tactical?-.3:0);flash=Math.max(0,flash-dt);muzzle.intensity=flash?30:0;hitTime=Math.max(0,hitTime-dt);targets.forEach(t=>{if(!t.visible&&now>t.userData.respawn){t.visible=true;t.userData.hp=120}if(t.visible&&t.userData.moving)t.position.x=t.userData.x+Math.sin(now*.9+t.userData.x)*2.4});for(let i=traces.length-1;i>=0;i--){const t=traces[i];t.life-=dt;t.line.material.opacity=Math.max(0,t.life/.09)*.65;if(t.life<=0){scene.remove(t.line);t.line.geometry.dispose();t.line.material.dispose();traces.splice(i,1)}}$('#stats').innerHTML=vel.length().toFixed(1)+' m/s<br>'+(grounded?(tactical?'TACTICAL SPRINT':shift?'SPRINT':'GROUND'):'AIRBORNE');$('#ammo').textContent=String(ammo).padStart(2,'0')+' / '+reserve;$('#status').textContent=reloading?'RELOADING · CLICK TO INTERRUPT':'READY · SHIFT ×2 TACTICAL';$('#hit').style.opacity=hitTime>0?1:0}renderer.render(scene,cam)}tick();</script></body></html>
